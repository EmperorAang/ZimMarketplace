version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: zim_marketplace_db
    environment:
      POSTGRES_USER: tafara_admin
      POSTGRES_PASSWORD: SecureZimPassword2026
      POSTGRES_DB: zim_marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: